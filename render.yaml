services:
  - type: web
    name: smi-quiz-lab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_TIMEOUT_MS
        value: "70000"
      - key: DEEPSEEK_API_KEY
        sync: false
